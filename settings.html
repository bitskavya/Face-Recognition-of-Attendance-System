<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings — Face Attendance</title>
  <style>
    :root {
      --bg1:#0f172a;
      --bg2:#1e293b;
      --accent1:#6366f1;
      --accent2:#22d3ee;
      --text:#f8fafc;
      --muted:#94a3b8;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:"Segoe UI",sans-serif;
      background:linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--text);
      min-height:100vh;display:flex;flex-direction:column;
    }
    header{
      display:flex;justify-content:space-between;align-items:center;
      padding:18px 10%;background:rgba(15,23,42,.8);backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(255,255,255,.05);
    }
    .logo{
      font-weight:800;font-size:1.3rem;
      background:linear-gradient(135deg,var(--accent1),var(--accent2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .user{
      font-size:.9rem;color:var(--muted);
    }
    main{
      flex:1;padding:50px 8%;
      display:grid;gap:30px;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    }
    .tile{
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px;
      padding:30px;text-align:center;
      box-shadow:0 6px 18px rgba(0,0,0,.35);
      transition:.3s;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
    }
    .tile:hover{
      transform:translateY(-8px) scale(1.03);
      border-color:var(--accent2);
      box-shadow:0 12px 28px rgba(34,211,238,.25);
    }
    .icon{
      width:70px;height:70px;
      border-radius:18px;
      display:grid;place-items:center;
      font-size:2rem;color:white;
      margin-bottom:16px;
      background:linear-gradient(135deg,var(--accent1),var(--accent2));
      box-shadow:inset 0 0 12px rgba(255,255,255,.2);
    }
    .tile h3{margin-bottom:8px;font-size:1.2rem;}
    .tile p{font-size:.9rem;color:var(--muted);}
    footer{
      text-align:center;padding:18px;color:var(--muted);
      border-top:1px solid rgba(255,255,255,.08);
      font-size:.85rem;
    }
    footer a{color:var(--accent2);text-decoration:none;}
    /* Include same CSS as in dashboard.html */
  </style>
</head>
<body>
  <header>
    <div class="logo">FaceAttend Dashboard</div>
    <div class="user">Welcome, <strong>User</strong></div>
  </header>

  <main>
    <div class="tile" style="grid-column: span 2;">
      <div class="icon">⚙️</div>
      <h3>Profile Settings</h3>
      <p>Update your preferences and profile information:</p>
      <ul style="margin-top: 20px; text-align: left; line-height: 1.8;">
        <li><a href="edit_profile.html" style="color: var(--accent2); text-decoration: none;">👤 Edit Profile</a></li>
        <li><a href="change_password.html" style="color: var(--accent2); text-decoration: none;">🔐 Change Password</a></li>
        <li><a href="notification.html" style="color: var(--accent2); text-decoration: none;">🔔 Notification Settings</a></li>
      </ul>
    </div>
  </main>

  <footer>
    <p>© 2025 FaceAttend | <a href="logout.html">Logout</a></p>
  </footer>
</body>
</html>

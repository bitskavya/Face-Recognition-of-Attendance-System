<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1b2233;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #2a3550;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #00c8ff;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #3a4565;
      color: white;
      font-size: 14px;
    }
    input:focus, select:focus {
      outline: 2px solid #00c8ff;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #00c8ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #0099cc;
    }
    p {
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
      color: #b5b5b5;
    }
  </style>
</head>
<body>
  <form method="post" action="edit_profile.php">
  <div class="container">
    <h2>Edit Profile</h2>

    <label for="firstName">First Name</label>
    <input type="text" id="firstName" name="firstName" placeholder="Enter First Name">

    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" name="lastName" placeholder="Enter Last Name">

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Enter Email">

    <label for="phone">Phone</label>
    <input type="text" id="phone" name="phone" placeholder="Enter Phone Number">

    <label for="department">Department</label>
    <select id="department" name="department">
      <option value="Computer Science">Computer Science</option>
      <option value="Electronics">Electronics</option>
      <option value="Mechanical">Mechanical</option>
      <option value="Civil">Civil</option>
      <option value="AIML">AIML</option>
      <option value="Electrical">ECE</option>
    </select>

    <label for="batch">Batch / Section</label>
    <input type="text" id="batch" name="batch" placeholder="e.g. 2025-2029 / CSE-A">

    <button type="button" onclick="saveProfile()">Save Changes</button>
    <p>Make sure your details match your institution records.</p>
  </div>
</form>

<script>
  // Load saved profile data
  window.onload = function() {
    document.getElementById("firstName").value = localStorage.getItem("firstName") || "";
    document.getElementById("lastName").value = localStorage.getItem("lastName") || "";
    document.getElementById("email").value = localStorage.getItem("email") || "";
    document.getElementById("phone").value = localStorage.getItem("phone") || "";
    document.getElementById("department").value = localStorage.getItem("department") || "Computer Science";
    document.getElementById("batch").value = localStorage.getItem("batch") || "";
  }

  // Save profile data & submit form
  function saveProfile() {
    localStorage.setItem("firstName", document.getElementById("firstName").value);
    localStorage.setItem("lastName", document.getElementById("lastName").value);
    localStorage.setItem("email", document.getElementById("email").value);
    localStorage.setItem("phone", document.getElementById("phone").value);
    localStorage.setItem("department", document.getElementById("department").value);
    localStorage.setItem("batch", document.getElementById("batch").value);

    alert("✅ Profile changes saved successfully!");

    // Submit the form to PHP
    document.querySelector('form').submit();
  }
</script>
</body>
</html>

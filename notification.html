<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Settings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1b2233;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #2a3550;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      width: 350px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #00c8ff;
    }
    .setting {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #3a4565;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 10px;
    }
    label {
      font-size: 16px;
    }
    input[type="checkbox"] {
      transform: scale(1.3);
      cursor: pointer;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #00c8ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #0099cc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔔 Notification Settings</h2>

    <div class="setting">
      <label for="email">Email Notifications</label>
      <input type="checkbox" id="email">
    </div>

    <div class="setting">
      <label for="sms">SMS Notifications</label>
      <input type="checkbox" id="sms">
    </div>

    <div class="setting">
      <label for="push">Push Notifications</label>
      <input type="checkbox" id="push">
    </div>

    <div class="setting">
      <label for="reminders">Reminders</label>
      <input type="checkbox" id="reminders">
    </div>

    <button onclick="saveSettings()">Save Settings</button>
  </div>

  <script>
    // Load saved settings on page load
    window.onload = function() {
      document.getElementById("email").checked = localStorage.getItem("email") === "true";
      document.getElementById("sms").checked = localStorage.getItem("sms") === "true";
      document.getElementById("push").checked = localStorage.getItem("push") === "true";
      document.getElementById("reminders").checked = localStorage.getItem("reminders") === "true";
    }

    // Save settings to localStorage
    function saveSettings() {
      localStorage.setItem("email", document.getElementById("email").checked);
      localStorage.setItem("sms", document.getElementById("sms").checked);
      localStorage.setItem("push", document.getElementById("push").checked);
      localStorage.setItem("reminders", document.getElementById("reminders").checked);

      alert("✅ Notification settings saved!");
    }
  </script>
</body>
</html>

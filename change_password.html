<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Change Password</title>
  <style>
    body{
      margin:0;
      font-family:Inter,Segoe UI,Arial,sans-serif;
      background:linear-gradient(180deg,#1e293b,#0f172a);
      color:#e2e8f0;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }
    .card{
      background:#0f172a;
      padding:32px;
      border-radius:14px;
      box-shadow:0 8px 30px rgba(0,0,0,.5);
      width:100%;
      max-width:380px;
    }
    .logo{
      width:70px;height:70px;
      margin:0 auto 18px;
      border-radius:18px;
      background:linear-gradient(135deg,#38bdf8,#6366f1);
      display:flex;align-items:center;justify-content:center;
      font-weight:700;font-size:26px;color:#fff;
    }
    h2{margin:0 0 12px;font-size:20px;text-align:center}
    p.sub{margin:0 0 20px;text-align:center;color:#94a3b8;font-size:14px}
    label{display:block;margin-bottom:6px;font-size:14px}
    input{
      width:100%;
      padding:10px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.1);
      background:rgba(255,255,255,0.05);
      color:#f8fafc;
      margin-bottom:14px;
      box-sizing:border-box;
    }
    input:focus{outline:none;border-color:#38bdf8}
    .btn{
      width:100%;
      padding:12px;
      border-radius:8px;
      border:0;
      cursor:pointer;
      background:linear-gradient(90deg,#38bdf8,#6366f1);
      color:#fff;
      font-weight:600;
      font-size:15px;
    }
    .links{margin-top:14px;text-align:center;font-size:13px}
    .links a{color:#38bdf8;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">FA</div>
    <h2>Change Password</h2>
    <p class="sub">Update your account password</p>
    <form method="post" action="change_password.php">
      <label for="current">Current Password</label>
      <input type="password" id="current" name="current" required />

      <label for="new">New Password</label>
      <input type="password" id="new" name="new" required />

      <label for="confirm">Confirm New Password</label>
      <input type="password" id="confirm" name="confirm" required />

      <button type="submit" class="btn">Update Password</button>
    </form>
    <div class="links">
      <a href="login.html">Back to Login</a>
    </div>
  </div>
</body>
</html>

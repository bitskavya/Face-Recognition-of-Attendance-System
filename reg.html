<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Face Attendance — Registration</title>
  <style>
    :root{
      --bg: #0f172a;         
      --card: #0b1024;        
      --muted: #94a3b8;       
      --text: #e5e7eb;        
      --accent: #6366f1;      
      --accent-2: #22d3ee;    
      --error: #ef4444;       
      --ok: #22c55e;          
      --ring: rgba(99,102,241,.4);
      --radius: 18px;
      --shadow: 0 10px 30px rgba(2,6,23,.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1000px 600px at 10% -10%, rgba(34,211,238,.12), transparent 60%),
        radial-gradient(800px 400px at 110% 10%, rgba(99,102,241,.14), transparent 60%),
        linear-gradient(180deg, #0b122b, #0f172a 40%, #0a0f23);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card{
      width: 100%;
      max-width: 750px;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border: 1px solid rgba(148,163,184,.15);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    .header{
      padding: 20px 24px;
      border-bottom: 1px solid rgba(148,163,184,.12);
      background:
        radial-gradient(600px 120px at 0% 0%, rgba(34,211,238,.15), transparent 60%),
        radial-gradient(600px 120px at 100% 0%, rgba(99,102,241,.15), transparent 60%);
      text-align: center;
    }

    .logo{
      width: 50px; height: 50px; border-radius: 14px;
      background: conic-gradient(from 210deg, var(--accent), var(--accent-2));
      display: grid; place-items: center;
      color: white; font-weight: 800;
      font-size: 1.2rem;
      margin: 0 auto 10px;
      box-shadow: 0 6px 16px rgba(34,211,238,.25), inset 0 0 12px rgba(255,255,255,.15);
    }
    .title{ font-size: 1.4rem; margin-bottom: 4px; }
    .subtitle{ font-size: .95rem; color: var(--muted); }

    form{ padding: 24px; display: grid; gap: 16px; }

    label{ font-size: .9rem; color: #cbd5e1; margin-bottom: 4px; display: block; }

    .input, select{
      width: 100%;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid rgba(148,163,184,.2);
      border-radius: 12px;
      color: var(--text);
      outline: none;
      transition: box-shadow .2s, border-color .2s;
    }
    .input:focus, select:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--ring);
    }

    .hint{ font-size: .8rem; color: var(--muted); margin-top: 2px; }

    .pw-hint{ font-size: .8rem; }
    .error{ color: var(--error); display: none; }
    .ok{ color: var(--ok); display: none; }
    input[name="password"]:invalid ~ .pw-hint .error{ display: block; }
    input[name="password"]:valid ~ .pw-hint .ok{ display: block; }

    .inline{ display: flex; align-items: center; gap: 10px; }
    .inline label{ margin: 0; }

    .actions{
      display: flex; gap: 12px; justify-content: space-between;
      margin-top: 10px;
    }
    .btn{
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: transform .1s, box-shadow .2s;
    }
    .btn:active{ transform: translateY(1px); }
    .btn-primary{
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      box-shadow: 0 6px 16px rgba(99,102,241,.35);
    }
    .btn-ghost{
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(148,163,184,.25);
    }

    .face-register{
      margin: 20px;
      padding: 20px;
      border: 1.5px dashed rgba(148,163,184,.35);
      border-radius: 14px;
      text-align: center;
      background: rgba(11,16,36,.5);
      transition: transform .2s, box-shadow .2s;
    }
    .face-register:hover{
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99,102,241,.25);
    }
    .face-register h3{ margin: 0 0 6px; font-size: 1.1rem; }
    .face-register p{ font-size: .9rem; color: var(--muted); margin-bottom: 10px; }
    .face-register .icon{ font-size: 2rem; margin-bottom: 6px; }
    .face-register a{
      display: inline-block;
      padding: 10px 16px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-weight: 600;
      text-decoration: none;
    }

    .foot{
      text-align: center;
      font-size:.85rem; color: var(--muted);
      border-top: 1px dashed rgba(148,163,184,.2);
      padding: 12px;
    }
    .foot a{ color:#a5b4fc; text-decoration: none; }
  </style>
</head>
<body>
  <section class="card">
    <div class="header">
      <div class="logo">FA</div>
      <h1 class="title">Register — Face Attendance</h1>
      <p class="subtitle">Create your account & enroll your details.</p>
    </div>

    <form action="reg.php" method="POST" enctype="multipart/form-data" novalidate>
      <div>
        <label for="role">Role *</label>
        <select id="role" name="role" required>
          <option value="">Select role</option>
          <option>Student</option>
          <option>Faculty</option>
          <option>Admin</option>
        </select>
      </div>

      <div>
        <label for="orgId">Institution/Employee ID *</label>
        <input class="input" id="orgId" name="orgId" required placeholder="BITS23CSE045 / EMP102"/>
      </div>

      <div>
        <label for="firstName">First Name *</label>
        <input class="input" id="firstName" name="firstName" required placeholder="Srinivas"/>
      </div>

      <div>
        <label for="lastName">Last Name *</label>
        <input class="input" id="lastName" name="lastName" required placeholder="Reddy"/>
      </div>

      <div>
        <label for="email">Email *</label>
        <input class="input" id="email" name="email" type="email" required placeholder="name@college.edu"/>
      </div>

      <div>
        <label for="phone">Phone</label>
        <input class="input" id="phone" name="phone" type="tel" placeholder="+91 98765 43210"/>
      </div>

      <div>
        <label for="dept">Department</label>
        <select id="dept" name="department">
          <option value="">Select department</option>
          <option>CSE</option>
          <option>ECE</option>
          <option>EEE</option>
          <option>ME</option>
          <option>CIVIL</option>
          <option>AI&ML</option>
        </select>
      </div>

      <div>
        <label for="batch">Batch / Section</label>
        <input class="input" id="batch" name="batch" placeholder="2025-2029 / CSE-A"/>
      </div>

      <div>
        <label for="password">Password *</label>
        <input class="input" id="password" name="password1" type="password" required minlength="8" placeholder="Min 8 chars, letters & numbers"/>
        <div class="pw-hint">
          <div class="error">Must be 8+ chars & include a number.</div>
          <div class="ok">Looks good ✔</div>
        </div>
      </div>

      <div>
        <label for="confirm">Confirm Password *</label>
        <input class="input" id="confirm" name="confirm" type="password" required placeholder="Re-enter password"/>
      </div>

      <div class="inline">
        <input id="tos" name="tos" type="checkbox" required/>
        <label for="tos">I agree to Terms & consent to biometric processing.</label>
      </div>

      <div class="actions">
        <button type="reset" class="btn btn-ghost">Reset</button>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </div>
    </form>

    <!-- Face registration block -->
    <div class="face-register">
      <div class="icon">📸</div>
      <h3>Register My Face</h3>
      <p>Use webcam to capture your face & link with your account.</p>
      <a href="regface.html">Go to Face Registration</a>
    </div>

    <p class="foot">Already registered? <a href="index.html">Sign in</a></p>
  </section>
</body>
</html>
